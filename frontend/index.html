<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FlowPilot - Workflow Automation</title>
    <meta name="description" content="FlowPilot: a visual workflow automation studio that runs on your own computer." />
    <meta name="theme-color" content="#e9522a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint so the login screen never flashes the wrong colours.
      try { document.documentElement.dataset.theme = localStorage.getItem('fp-theme') === 'dark' ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
